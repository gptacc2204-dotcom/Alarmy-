name: Build ScanWakeAlarm APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto-Fix Folder Structure
        run: |
          mkdir -p app/src/main/java/com/scanwake/alarm
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          mv -f MainActivity.kt AlarmActivity.kt AlarmReceiver.kt AlarmService.kt app/src/main/java/com/scanwake/alarm/ 2>/dev/null || true
          mv -f AndroidManifest.xml app/src/main/ 2>/dev/null || true
          mv -f activity_main.xml activity_alarm.xml app/src/main/res/layout/ 2>/dev/null || true
          mv -f strings.xml themes.xml app/src/main/res/values/ 2>/dev/null || true
          mv -f proguard-rules.pro app/ 2>/dev/null || true

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.scanwake.alarm"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.scanwake.alarm"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              val cameraxVersion = "1.3.4"
              implementation("androidx.camera:camera-core:$cameraxVersion")
              implementation("androidx.camera:camera-camera2:$cameraxVersion")
              implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
              implementation("androidx.camera:camera-view:$cameraxVersion")
              implementation("com.google.mlkit:image-labeling:17.0.9")
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanWakeAlarm-APK
          path: app/build/outputs/apk/debug/app-debug.apk
